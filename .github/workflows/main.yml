name: Build UZ LIFE RP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"
          sdkmanager "cmake;3.10.2.4988404"
          sdkmanager "ndk;28.1.13356709"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Check project
        run: |
          ls -la
          test -f project.godot
          test -f export_presets.cfg

      - name: Import project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-release "Android" \
            build/UZ-LIFE-RP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UZ-LIFE-RP-Android
          path: build/UZ-LIFE-RP.apk
